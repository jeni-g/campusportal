{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Event Registration {% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alata&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: "Alata", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        position: relative;
        min-height: 100vh;
    }
    .bg-img {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
    }
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: -1;
    }
    .register-container {
        position: relative;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        padding: 40px;
        border-radius: 12px;
        width: 350px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .register-container h2 {
        font-family: "Unbounded", sans-serif;
        margin-bottom: 20px;
    }
    .register-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .register-form input,
    .register-form select {
        padding: 10px;
        border: none;
        border-radius: 6px;
        outline: none;
    }
    .register-form button {
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: linear-gradient(90deg, #6acbcb, #4b81d7);
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }
    .register-form button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
    }
    p {
        text-align: center;
        margin-top: 10px;
    }
    a {
        color: red;
        text-decoration: none;
    }
    p a:hover {
        color: whitesmoke;
    }
    .popup-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
    }
    .popup {
        background: #4dff6e9f;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        font-size: 14px;
        animation: fadeSlide 3s ease forwards;
    }
    @keyframes fadeSlide {
        0% {
            opacity: 0;
            transform: translateY(-20px);
        }
        10% {
            opacity: 1;
            transform: translateY(0);
        }
        90% {
            opacity: 1;
        }
        100% {
            opacity: 0;
            transform: translateY(-20px);
        }
    }
</style>
<body>
    <img src="{% static 'myapp/images/campus1.jpg' %}" class="bg-img" alt="campusregister">
    <div class="register-container">
        {% if messages %}
        <div class="popup-container">
            {% for message in messages %}
            <div class="popup">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        <h2>Event Registration</h2>
        <form method="POST" class="register-form">
            {% csrf_token %}
            <input type="text" name="student_name" placeholder="Student Name" required>
            <input type="text" name="department" placeholder="Department" required>
            <input type="number" name="register_number" placeholder="Register Number" required>
            <input type="tel" name="phone" placeholder="Phone Number" required>
            <select name="event" required>
                <option>Select Event</option>
                <option>Hackathon 2026</option>
                <option>AI Workshop</option>
                <option>Sports Day</option>
            </select>
            <button type="submit">
                <i class="bi bi-ticket-perforated"></i>
                Submit Registration
            </button>
            <p><a href="{% url 'index' %}"><i class="bi bi-arrow-left"></i> Back to Home</a>
            </p>
        </form>
    </div>
</body>
</html>
