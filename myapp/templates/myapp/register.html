{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5 shadow p-4 rounded bg-dark" style="max-width:450px;">
        <h2 class="mb-4 text-center">Create Account</h2>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">  <i class="bi bi-person-fill me-1"></i> Username</label>
                <input type="text" name="username" class="form-control" placeholder=" Enter Your Name"  required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-envelope-fill me-1"></i> Email</label>
                <input type="email" name="email" class="form-control" placeholder=" Enter Your Email" required>
            </div>
            <div class="mb-3">
                <label class="form-label"> <i class="bi bi-lock-fill me-1"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder=" Enter Password" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-lock-fill me-1"></i> Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Re-Enter Password" required>
            </div>
            <button type="submit" class="btn btn-success w-100">  <i class="bi bi-person-plus-fill me-1"></i> Register</button>
        </form>
        <p class="mt-3 text-center">
            Already have an account?
            <a href="{% url 'login' %}" class="text-info"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
        </p>
        <p class="text-center">
            <a href="{% url 'index' %}" class="text-decoration-none text-light">
            <i class="bi bi-arrow-left"></i> Back to Home</a>
        </p>
    </div>
</body>
</html>
