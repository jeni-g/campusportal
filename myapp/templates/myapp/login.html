{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<div class="container mt-5" style="max-width:400px;">
    <h2 class="mb-4 text-center">Login</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-warning">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label"><i class="bi bi-person-fill me-1"></i> Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label"><i class="bi bi-lock-fill me-1"></i> Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i> Login</button>
    </form>
    <p class="mt-3 text-center">
        Don’t have an account?
        <a href="{% url 'register' %}" class="text-info"> <i class="bi bi-person-plus"></i> Register</a>
    </p>
    <p class="text-center mt-2">
        <a href="{% url 'index' %}" class="text-decoration-none text-light"> <i class="bi bi-arrow-left"></i> Back to Home</a>
    </p>
</div>
</body>
</html>
